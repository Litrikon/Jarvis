<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДЖАРВИС — локальный чат</title>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2c; --panel2:#16213a; --line:#1f2d4a;
    --txt:#dbe7ff; --dim:#8fa3c8; --cyan:#00c3ff; --gold:#ffc23c;
    --user:#1d3a5f; --jarvis:#182238;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #142447 0%, var(--bg) 55%);
    color:var(--txt); font:15px/1.55 "Segoe UI", system-ui, sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:14px 22px;
    background:linear-gradient(180deg, rgba(0,195,255,.08), transparent);
    border-bottom:1px solid var(--line);
  }
  header .logo{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(160deg,#123, #0a2e46);
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(0,195,255,.55);
    box-shadow:0 0 18px rgba(0,195,255,.25);
    font-size:22px;
  }
  header h1{font-size:19px; letter-spacing:2.5px; font-weight:600}
  header h1 b{color:var(--cyan); font-weight:700}
  header .sub{font-size:12px; color:var(--dim); margin-top:2px}
  .dot{
    width:10px; height:10px; border-radius:50%; background:#e5484d;
    display:inline-block; margin-right:6px; vertical-align:1px;
    box-shadow:0 0 8px currentColor;
  }
  .dot.on{background:#2bd67b; color:#2bd67b; animation:pulse 2s infinite}
  .dot.wait{background:var(--gold); color:var(--gold)}
  @keyframes pulse{50%{opacity:.45}}
  .hbtn{
    margin-left:auto; background:none; border:1px solid var(--line);
    color:var(--dim); border-radius:8px; padding:6px 12px; cursor:pointer;
    font-size:12.5px;
  }
  .hbtn:hover{border-color:var(--cyan); color:var(--txt)}
  .hbtn + .hbtn{margin-left:0}
  #clear{margin-left:auto}
  #filesbtn{margin-left:0}
  #chat{
    flex:1; overflow-y:auto; padding:26px 22px; scroll-behavior:smooth;
  }
  body.dropping #chat{outline:2px dashed var(--cyan); outline-offset:-8px; border-radius:12px}
  .msg{
    max-width:76%; margin:0 0 14px; padding:11px 15px; border-radius:14px;
    white-space:pre-wrap; word-wrap:break-word; box-shadow:0 2px 10px rgba(0,0,0,.25);
    animation:in .18s ease;
  }
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1}}
  .msg.user{background:var(--user); margin-left:auto; border-bottom-right-radius:4px}
  .msg.jarvis{background:var(--jarvis); border:1px solid var(--line); border-bottom-left-radius:4px}
  .msg.glm{background:linear-gradient(135deg,#232a3d,#2d2340); border:1px solid #4a3f6b; border-bottom-left-radius:4px}
  .msg.say{
    background:transparent; border:1px dashed rgba(0,195,255,.4); color:var(--cyan);
    font-size:13px; max-width:90%; margin:0 auto 14px; text-align:center;
  }
  .msg.err{background:#3a1620; border:1px solid #6b2436; color:#ffb3c0; font-size:13.5px}
  .msg img{max-width:100%; border-radius:8px; margin-top:6px}
  .msg .tag{font-size:10.5px; color:#5f7099; letter-spacing:.4px; margin-bottom:5px}
  .msg .tag.tg{color:#3fa7ff}
  .typing-cursor{display:inline-block; width:8px; height:15px; background:var(--cyan);
    vertical-align:-2px; margin-left:2px; animation:pulse 1s infinite}
  #chips{
    display:flex; flex-wrap:wrap; gap:8px; padding:0 22px 10px;
  }
  #chips:empty{display:none}
  .chip{
    display:flex; align-items:center; gap:8px; max-width:340px;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:6px 10px; font-size:13px; color:var(--txt);
  }
  .chip.uploading{border-color:var(--gold); color:var(--gold)}
  .chip.bad{border-color:#6b2436; color:#ffb3c0}
  .chip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chip .x{
    background:none; border:none; color:var(--dim); cursor:pointer;
    font-size:14px; padding:0 2px; line-height:1;
  }
  .chip .x:hover{color:#ff7b8a}
  form{
    display:flex; gap:10px; padding:16px 22px 20px;
    background:linear-gradient(0deg, rgba(0,0,0,.35), transparent);
  }
  textarea{
    flex:1; resize:none; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line); border-radius:12px; padding:11px 14px;
    font:15px/1.4 "Segoe UI", system-ui, sans-serif; outline:none; max-height:140px;
  }
  textarea:focus{border-color:rgba(0,195,255,.6); box-shadow:0 0 0 3px rgba(0,195,255,.12)}
  button{
    background:linear-gradient(160deg,#00c3ff,#0079b5); border:none; color:#04121e;
    font-weight:700; font-size:15px; border-radius:12px; padding:0 22px; cursor:pointer;
  }
  button:disabled{opacity:.45; cursor:default}
  #attach{
    padding:0 16px; font-size:18px; font-weight:400;
  }
  #mic{
    padding:0 16px; font-size:18px; font-weight:400;
  }
  #mic.rec{
    background:linear-gradient(160deg,#ff5470,#b52d43); color:#fff;
    animation:pulse 1s infinite;
  }
  #send.busy{animation:pulse 1s infinite}
  .hint{position:fixed; right:26px; bottom:88px; font-size:11.5px; color:#5f7099}
  #fpanel{
    position:fixed; top:0; right:0; bottom:0; width:min(380px, 92vw);
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(105%); transition:transform .25s ease; z-index:50;
    display:flex; flex-direction:column;
  }
  #fpanel.open{transform:translateX(0)}
  #fhead{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--line); font-size:14px; letter-spacing:1px;
  }
  #fclose{
    margin-left:auto; background:none; border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:3px 10px; cursor:pointer; font-size:13px; font-weight:400;
  }
  #fclose:hover{color:var(--txt); border-color:var(--cyan)}
  #flist{flex:1; overflow-y:auto; padding:10px 12px}
  .frow{
    display:flex; flex-direction:column; gap:2px; padding:9px 10px;
    border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
  }
  .frow a{color:var(--cyan); text-decoration:none; font-size:13.5px; word-break:break-all}
  .frow a:hover{text-decoration:underline}
  .frow .fmeta{font-size:11.5px; color:var(--dim)}
  .fempty{color:var(--dim); font-size:13px; padding:10px; text-align:center}
  /* v3.15 (Task 136): карточки-файлы ПРЯМО в сообщениях (скачивание) */
  .msg .fcards{display:flex; flex-direction:column; gap:6px; margin-top:8px}
  .fcard{
    display:flex; align-items:center; gap:9px; background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; padding:7px 10px;
  }
  .fcard .fico{font-size:16px; line-height:1}
  .fcard a{color:var(--cyan); text-decoration:none; font-size:13px; word-break:break-all; flex:1}
  .fcard a:hover{text-decoration:underline}
  .fcard .fsz{font-size:11px; color:var(--dim); white-space:nowrap}
  @media (max-width:640px){ .msg{max-width:92%} .hint{display:none} }
</style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div>
    <h1>ДЖА<b>РВИС</b></h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="status">проверяю мозг…</span> · зеркало Telegram</div>
  </div>
  <button id="clear" class="hbtn" title="Очистить историю">🧹 Очистить</button>
  <button id="speak" class="hbtn" title="Озвучка ответов">🔇</button>
  <button id="filesbtn" class="hbtn" title="Входящие и выгрузка Джарвиса">📂 Файлы</button>
</header>
<div id="chat"></div>
<div id="chips"></div>
<div class="hint">Enter — отправить · Shift+Enter — новая строка · файлы: 📎, перетаскиванием или Ctrl+V · голос: 🎤 (Esc — отмена) · озвучка: 🔊 или «ответь голосом» в запросе (можно с именем: «ответь голосом дениса»)</div>
<form id="f">
  <button id="attach" type="button" title="Прикрепить файлы">📎</button>
  <button id="mic" type="button" title="Голосовой ввод">🎤</button>
  <textarea id="q" rows="1" placeholder="Спроси Джарвиса о чём угодно…"></textarea>
  <button id="send" type="submit">Отправить</button>
</form>
<input type="file" id="fileinp" multiple hidden>
<div id="fpanel">
  <div id="fhead">📂 ФАЙЛЫ ДЖАРВИСА <button id="fclose" type="button">✕ закрыть</button></div>
  <div id="flist"><div class="fempty">Загружаю список…</div></div>
</div>
<script>
"use strict";
const chat = document.getElementById("chat");
const chipsEl = document.getElementById("chips");
const q = document.getElementById("q");
const f = document.getElementById("f");
const send = document.getElementById("send");
const dot = document.getElementById("dot");
const statusEl = document.getElementById("status");
let history = [];
let pending = [];   // v3.1.1: прикреплённые файлы [{name, path, size}]
let uploading = 0;  // сколько файлов сейчас грузится
try { history = JSON.parse(localStorage.getItem("jarvis_chat_hist") || "[]"); } catch(e) {}

function saveHist(){ localStorage.setItem("jarvis_chat_hist", JSON.stringify(history.slice(-40))); }

function fmtSize(n){
  if (n < 1024) return n + " Б";
  if (n < 1048576) return (n / 1024).toFixed(1) + " КБ";
  return (n / 1048576).toFixed(1) + " МБ";
}

function addMsg(cls, text){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addImg(b64){
  const d = document.createElement("div");
  d.className = "msg jarvis";
  const img = document.createElement("img");
  img.src = "data:image/png;base64," + b64;
  d.appendChild(img);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- v3.15 (Task 136): карточки-файлы в сообщениях — скачивание ---------- */

function fileCard(fl){
  /* fl: {path, name, size} — ссылка «скачать» через /api/file */
  const card = document.createElement("div");
  card.className = "fcard";
  const ico = document.createElement("span");
  ico.className = "fico";
  ico.textContent = "📎";
  const a = document.createElement("a");
  a.href = "/api/file?p=" + encodeURIComponent(fl.path);
  a.textContent = fl.name || String(fl.path).split("\\").pop();
  a.title = "Скачать: " + a.textContent;
  a.download = "";
  const sz = document.createElement("span");
  sz.className = "fsz";
  sz.textContent = fl.size ? fmtSize(fl.size) : "";
  card.appendChild(ico);
  card.appendChild(a);
  if (fl.size) card.appendChild(sz);
  return card;
}

function addFilesToBubble(bubble, files){
  if (!bubble || !files || !files.length) return;
  const wrap = document.createElement("div");
  wrap.className = "fcards";
  for (const fl of files){
    if (fl && fl.path) wrap.appendChild(fileCard(fl));
  }
  bubble.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

let filesCache = [];   /* свежие файлы Джарвиса — для ссылок в истории/зеркале */
async function cacheFiles(){
  try{
    const r = await fetch("/api/files");
    const j = await r.json();
    filesCache = j.files || [];
  }catch(e){}
}

function renderHistory(){
  for (const m of history){
    const b = addMsg(m.role === "user" ? "user" : "jarvis", m.content);
    addFilesToBubble(b, m.files);   /* v3.15: карточки-скачивания из истории */
  }
  if (!history.length){
    addMsg("jarvis", "Добрый день, Шеф. Джарвис на связи — мозг Qwen3.8-27B работает на вашей видеокарте. Прикрепи файл кнопкой 📎 (или перетащи, или Ctrl+V) — посмотрю и разберу. Нажми 🎤 и скажи вслух — расшифрую в текст. Чем могу помочь?");
  }
}

let mirrorLast = null;
try { mirrorLast = parseInt(localStorage.getItem("jarvis_mirror_last")); } catch(e) {}

function addMirrorMsg(m){
  const d = document.createElement("div");
  d.className = "msg " + (m.who === "boss" ? "user" : (m.who === "glm" ? "glm" : "jarvis"));
  const tag = document.createElement("div");
  tag.className = "tag" + (m.ch === "tg" ? " tg" : "");
  tag.textContent = (m.who === "glm" ? "🧠 GLM (z.ai)" : (m.ch === "tg" ? "📱 Telegram" : "🖥 локальный")) + " · " + (m.ts || "");
  d.appendChild(tag);
  const body = document.createElement("div");
  body.textContent = m.text;
  d.appendChild(body);
  /* v3.15 (Task 136): файлы в сообщениях зеркала тоже скачиваются —
     «📎 имя (размер)» у Шефа и пути X:\... у Джарвиса сверяем с /api/files */
  try{
    const fls = [];
    if (m.who === "boss" || m.who === "glm"){
      const re = /📎 ([^\n(]+?) \(/g;
      let mm;
      while ((mm = re.exec(m.text))){
        const hit = filesCache.find(f => f.n === mm[1].trim());
        if (hit) fls.push({path: hit.p, name: hit.n, size: hit.s});
      }
    } else {
      const re = /[A-Za-z]:\\[^\s«»"']+/g;
      let mm;
      const seen = new Set();
      while ((mm = re.exec(m.text))){
        const nm = mm[0].split("\\").pop().replace(/[.,;:!?)\]]+$/, "");
        const hit = filesCache.find(f => f.n === nm);
        if (hit && !seen.has(hit.p)){ seen.add(hit.p); fls.push({path: hit.p, name: nm, size: hit.s}); }
      }
    }
    if (fls.length) addFilesToBubble(d, fls);
  }catch(e){}
  chat.appendChild(d);
}

async function pollMirror(){
  try{
    if (!filesCache.length) await cacheFiles();   /* v3.15: ссылки на файлы */
    const first = (mirrorLast === null || isNaN(mirrorLast));
    const after = first ? 0 : mirrorLast;
    const r = await fetch("/api/messages?after=" + after);
    const j = await r.json();
    const msgs = j.msgs || [];
    const show = first ? msgs.slice(-30) : msgs;  // при первом открытии — только хвост
    let last = after;
    for (const m of show){
      if (m.i !== undefined) last = Math.max(last, m.i + 1);
      if (m.ch === "web" && m.who !== "glm") continue;  // своё уже показано стримом (кроме GLM)
      addMirrorMsg(m);
    }
    mirrorLast = last;
    localStorage.setItem("jarvis_mirror_last", String(last));
    if (show.some(m => m.ch === "tg")) chat.scrollTop = chat.scrollHeight;
  }catch(e){}
}

async function refreshStatus(){
  try{
    const r = await fetch("/api/status");
    const j = await r.json();
    if (j.ok){ dot.className = "dot on"; statusEl.textContent = "мозг на связи · " + j.model + (j.vision ? " · зрение" : "") + (j.voice ? " · голос" : ""); }
    else { dot.className = "dot wait"; statusEl.textContent = "мозг спит — напишите что-нибудь, разбужу"; }
  }catch(e){ dot.className="dot"; statusEl.textContent = "сервер чата недоступен"; }
}

/* ---------- v3.1.1 (Task 97): файлы ---------- */

function addChip(text, cls){
  const c = document.createElement("div");
  c.className = "chip" + (cls ? " " + cls : "");
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = text;
  const x = document.createElement("button");
  x.className = "x";
  x.type = "button";
  x.textContent = "✕";
  x.title = "Убрать из письма";
  c.appendChild(nm);
  c.appendChild(x);
  chipsEl.appendChild(c);
  return {el: c, txt: (t, cls2) => { nm.textContent = t; if (cls2) c.classList.add(cls2); },
          onRemove: (cb) => x.addEventListener("click", () => { cb(); c.remove(); })};
}

function renderChips(){
  chipsEl.innerHTML = "";
  for (const fl of pending){
    const ch = addChip("📎 " + fl.name + " · " + fmtSize(fl.size));
    ch.onRemove(() => { pending = pending.filter(p => p !== fl); });
  }
}

async function handleFiles(list){
  for (const file of list){
    if (file.size > 100 * 1024 * 1024){
      addMsg("err", "⚠️ " + file.name + " — больше 100 МБ, не приму");
      continue;
    }
    uploading++;
    const ch = addChip(file.name + " — загружаю…", "uploading");
    ch.onRemove(() => {});
    try{
      const r = await fetch("/api/upload?name=" + encodeURIComponent(file.name),
                            {method: "POST", body: file});
      const j = await r.json();
      if (j.ok){
        pending.push({name: j.name, path: j.path, size: j.size});
        ch.txt("📎 " + j.name + " ✓ " + fmtSize(j.size));
        ch.onRemove(() => { pending = pending.filter(p => p.path !== j.path); });
      } else {
        ch.txt(file.name + " ✗ " + (j.error || "ошибка"), "bad");
      }
    }catch(e){
      ch.txt(file.name + " ✗ связь оборвалась", "bad");
    }
    uploading--;
  }
}

const fileinp = document.getElementById("fileinp");
document.getElementById("attach").addEventListener("click", () => fileinp.click());
fileinp.addEventListener("change", () => { handleFiles(fileinp.files); fileinp.value = ""; });

/* ---------- v3.2.0 (Task 98): голосовой ввод 🎤 ---------- */

const micBtn = document.getElementById("mic");
let rec = null;   // {ctx, node, stream, chunks, t0, rate, timer}

function wavFromChunks(chunks, rate){
  /* Пишем прямо в браузере: даунсемпл до 16 кГц + WAV (PCM int16 моно) —
     сервер получает готовый wav, конвертация не нужна. */
  let n = 0;
  for (const c of chunks) n += c.length;
  const ratio = rate / 16000;
  const outN = Math.max(1, Math.floor(n / ratio));
  const pcm = new Int16Array(outN);
  let idx = 0, acc = 0, cnt = 0, oi = 0;
  for (const c of chunks){
    for (let i = 0; i < c.length; i++){
      acc += c[i]; cnt++;
      if (cnt >= ratio){
        let v = acc / cnt; cnt = 0; acc = 0;
        v = Math.max(-1, Math.min(1, v));
        pcm[oi++] = v < 0 ? v * 0x8000 : v * 0x7FFF;
      }
    }
    idx += c.length;
  }
  const buf = new ArrayBuffer(44 + oi * 2);
  const dv = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); dv.setUint32(4, 36 + oi * 2, true); ws(8, "WAVE");
  ws(12, "fmt "); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, 1, true); dv.setUint32(24, 16000, true);
  dv.setUint32(28, 32000, true); dv.setUint16(32, 2, true);
  dv.setUint16(34, 16, true); ws(36, "data"); dv.setUint32(40, oi * 2, true);
  for (let i = 0; i < oi; i++) dv.setInt16(44 + i * 2, pcm[i], true);
  return new Blob([buf], {type: "audio/wav"});
}

async function micToggle(){
  if (rec){ stopRec(false); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia(
      {audio: {echoCancellation: true, noiseSuppression: true}});
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const node = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    node.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    /* без эха: процессор обязан быть в графе, но глушим выход нулевым гейном */
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(node); node.connect(mute); mute.connect(ctx.destination);
    rec = {ctx, node, stream, chunks, t0: Date.now(), rate: ctx.sampleRate,
           timer: setTimeout(() => stopRec(false), 90000)};
    micBtn.classList.add("rec"); micBtn.textContent = "⏹";
    addMsg("say", "🎙 Слушаю… говори и нажми ⏹ (или Esc — отмена)");
  }catch(e){
    addMsg("err", "⚠️ Микрофон недоступен: " + e);
  }
}

function stopRec(cancel){
  if (!rec) return;
  clearTimeout(rec.timer);
  const chunks = rec.chunks, rate = rec.rate, dur = (Date.now() - rec.t0) / 1000;
  try { rec.node.disconnect(); rec.stream.getTracks().forEach(t => t.stop()); rec.ctx.close(); } catch(e) {}
  rec = null;
  micBtn.classList.remove("rec"); micBtn.textContent = "🎤";
  if (cancel) return;
  if (dur < 0.7 || !chunks.length){
    addMsg("say", "⏺ Слишком коротко — не услышал");
    return;
  }
  const blob = wavFromChunks(chunks, rate);
  const ch = addChip("🎙 расшифровываю %d сек…".replace("%d", Math.round(dur)), "uploading");
  ch.onRemove(() => {});
  fetch("/api/asr", {method: "POST", body: blob})
    .then(r => r.json())
    .then(j => {
      if (j.ok && j.text){
        ch.txt("🎙 ✓ «" + j.text.slice(0, 80) + (j.text.length > 80 ? "…" : "") + "»");
        setTimeout(() => ch.el.remove(), 2500);
        q.value = (q.value ? q.value + " " : "") + j.text;
        q.focus();
        q.setSelectionRange(q.value.length, q.value.length);
        q.style.height = "auto";
        q.style.height = Math.min(q.scrollHeight, 140) + "px";
      } else {
        ch.txt("🎙 ✗ " + (j.error || "не распозналось"), "bad");
      }
    })
    .catch(e => ch.txt("🎙 ✗ связь оборвалась: " + e, "bad"));
}

/* ---------- озвучка: 🔊 (постоянно) + «ответь голосом» (разово) ----------
   v3.4.0 (Task 101): кнопка 🔊 (piper). v3.16 (Task 137): фраза
   «ответь голосом [имя]» в любом месте запроса — ответ озвучивается
   РАЗОВО даже при выключенной 🔊; лимит 600 -> 1000 символов;
   &voice=имя — разовый голос (денис/дмитрий/руслан/ирина). */
let ttsOn = localStorage.getItem("tts") === "1";
const speakBtn = document.getElementById("speak");
function ttsPaint(){
  speakBtn.textContent = ttsOn ? "🔊" : "🔇";
  speakBtn.title = ttsOn ? "Озвучка всех ответов — выключить"
                        : "Озвучка всех ответов — включить";
}
function ttsToggle(){
  ttsOn = !ttsOn;
  localStorage.setItem("tts", ttsOn ? "1" : "0");
  ttsPaint();
  if (ttsOn) speakFinal("Озвучка включена. Джарвис на связи.");
}
async function speakFinal(text){
  if (!ttsOn || !text) return;
  await speakForced(text, null);
}
async function speakForced(text, voice){   /* v3.16: разовая озвучка «ответь голосом» */
  if (!text) return;
  try {
    let u = "/api/tts?text=" + encodeURIComponent(text.slice(0, 1000));
    if (voice) u += "&voice=" + encodeURIComponent(voice);
    const r = await fetch(u);
    if (!r.ok) return;
    const b = await r.blob();
    new Audio(URL.createObjectURL(b)).play();
  } catch(e) {}
}
/* v3.16 (Task 137): «ответь голосом [имя]» — вырезаем ДО отправки
   (синхронно с jarvis.voice_split: «?»/«!» перед фразой остаются вопросу;
   сервер — страховка, если клиентский regexp промахнулся) */
const VOICE_RE = /[\s,.;:\-—()«»"']*(?:ответ(?:ить|ь|ьте)?|отвечай)[\s,.;:\-—()«»"']*голосом[\s,.;:!?\-—()«»"']*/gi;
const VOICE_STEMS = {"дени": "денис", "дмитр": "дмитрий", "руслан": "руслан", "ирин": "ирина"};
function voiceSplit(t){
  if (!t || !VOICE_RE.test(t)) return [t, false, null];
  let rest = t.replace(VOICE_RE, "\x00");
  let name = null;
  const m = rest.match(/[\x00]\s*(дени|дмитр|руслан|ирин)[а-яё]*[\s,.;:!?\-—()«»]*/i);
  if (m){
    name = VOICE_STEMS[m[1].toLowerCase()] || null;
    rest = rest.slice(0, m.index) + rest.slice(m.index + m[0].length);
  }
  rest = rest.replace(/\x00/g, " ").replace(/[ \t]{2,}/g, " ").trim();
  return [rest, true, name];
}
speakBtn.addEventListener("click", ttsToggle);
ttsPaint();

});

/* панель файлов: список + скачивание */
async function refreshFiles(){
  const el = document.getElementById("flist");
  el.innerHTML = "";
  try{
    const r = await fetch("/api/files");
    const j = await r.json();
    const files = j.files || [];
    if (!files.length){
      el.innerHTML = "<div class='fempty'>Пока пусто.<br>Входящие: E:\\Downloads\\Jarvis\\Входящие<br>Выгрузка: E:\\Downloads\\Jarvis</div>";
      return;
    }
    for (const fl of files){
      const row = document.createElement("div");
      row.className = "frow";
      const a = document.createElement("a");
      a.href = "/api/file?p=" + encodeURIComponent(fl.p);
      a.textContent = (fl.d === "in" ? "📥 " : "📤 ") + fl.n;
      const meta = document.createElement("span");
      meta.className = "fmeta";
      const dt = new Date(fl.t * 1000);
      meta.textContent = fmtSize(fl.s) + " · " +
        dt.toLocaleDateString("ru-RU") + " " + dt.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}) +
        (fl.d === "in" ? " · входящий" : " · выгрузка");
      row.appendChild(a);
      row.appendChild(meta);
      el.appendChild(row);
    }
  }catch(e){
    el.innerHTML = "<div class='fempty'>Не удалось получить список</div>";
  }
}
document.getElementById("filesbtn").addEventListener("click", () => {

  p.classList.toggle("open");
  if (p.classList.contains("open")) refreshFiles();
});

/* ---------- отправка ---------- */

async function ask(text, files, disp){
  send.disabled = true;
  /* v3.16 (Task 137): «ответь голосом [имя]» — вырезаем до отправки,
     ответ озвучим разово (даже при выключенной 🔊) */
  let wantVoice = false, vName = null;
  [text, wantVoice, vName] = voiceSplit(text);
  if (wantVoice && !text && !(files || []).length){
    addMsg("say", "🎙 Что именно озвучить? Напиши вопрос и добавь в него «ответь голосом».");
    send.disabled = false;
    return;
  }
  if (wantVoice)
    addMsg("say", "🔊 Озвучу ответ голосом " + ((vName || "основным")[0].toUpperCase() + (vName || "основным").slice(1)));
  const bubble = addMsg("jarvis", "");
  const cursor = document.createElement("span");
  cursor.className = "typing-cursor";
  bubble.appendChild(cursor);
  let acc = "";
  let hadError = false;
  const turnFiles = [];   /* v3.15: файлы, которые Джарвис выложил в этом ответе */
  try{
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text,
                            files: (files || []).map(fl => ({path: fl.path, size: fl.size})),
                            history: history.slice(-20)})
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line); } catch(e) { continue; }
        if (ev.type === "tok"){ acc += ev.text; bubble.textContent = acc; bubble.appendChild(cursor); chat.scrollTop = chat.scrollHeight; }
        else if (ev.type === "say"){ cursor.remove(); addMsg("say", "⚙️ " + ev.text); bubble.appendChild(cursor); }
        else if (ev.type === "tool"){ cursor.remove(); addMsg("say", "🛠 инструмент: " + ev.name); bubble.appendChild(cursor); }
        else if (ev.type === "image"){ cursor.remove(); addImg(ev.b64); bubble.appendChild(cursor); }
        else if (ev.type === "file"){ cursor.remove(); turnFiles.push(ev); addFilesToBubble(bubble, [ev]); bubble.appendChild(cursor); }
        else if (ev.type === "voice"){ wantVoice = true; if (ev.name) vName = ev.name.toLowerCase(); }  /* v3.16: сервер подтвердил приказ голосом */
        else if (ev.type === "waiting"){ dot.className = "dot wait"; statusEl.textContent = "загружаю мозг в видеопамять…"; }
        else if (ev.type === "done"){ acc = ev.text || acc; }
        else if (ev.type === "error"){ hadError = true; cursor.remove(); addMsg("err", "⚠️ " + ev.text); }
      }
    }
  }catch(e){ hadError = true; addMsg("err", "⚠️ Связь с сервером чата оборвалась: " + e); }
  cursor.remove();
  bubble.textContent = acc || (hadError ? "" : "…");
  addFilesToBubble(bubble, turnFiles);   /* карточки не теряются при финальном тексте */
  if (acc){
    history.push({role:"user", content: disp || text, files: (files || []).map(fl => ({path: fl.path, name: fl.name, size: fl.size}))});
    history.push({role:"assistant", content:acc, files: turnFiles.map(f => ({path: f.path, name: f.name, size: f.size}))});
    saveHist();
    if (wantVoice) speakForced(acc, vName);   /* v3.16: разовая озвучка приказом */
    else speakFinal(acc);
  }
  cacheFiles();   /* обновить кэш — новые файлы появятся и в зеркале */
  send.disabled = false;
  refreshStatus();
}

f.addEventListener("submit", (e)=>{
  e.preventDefault();
  const text = q.value.trim();
  if (uploading > 0){ addMsg("say", "⏳ Файлы ещё загружаются — секунду…"); return; }
  if ((!text && !pending.length) || send.disabled) return;
  const files = pending.slice();
  let disp = text;
  if (files.length){
    disp += (disp ? "\n" : "") + files.map(fl => "📎 " + fl.name + " (" + fmtSize(fl.size) + ")").join("\n");
  }
  const ub = addMsg("user", disp);
  addFilesToBubble(ub, files);   /* v3.15: свои вложения — сразу со ссылкой «скачать» */
  q.value = ""; q.style.height = "auto";
  pending = [];
  renderChips();
  ask(text, files, disp);
});
q.addEventListener("keydown", (e)=>{
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); f.requestSubmit(); }
});
q.addEventListener("input", ()=>{
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 140) + "px";
});
document.getElementById("clear").addEventListener("click", ()=>{
  history = []; saveHist(); chat.innerHTML = "";
  renderHistory();
});
renderHistory();
refreshStatus();
cacheFiles();
setInterval(cacheFiles, 60000);   /* v3.15: свежие файлы для ссылок в зеркале */
pollMirror();
setInterval(refreshStatus, 15000);
setInterval(pollMirror, 3000);
q.focus();
